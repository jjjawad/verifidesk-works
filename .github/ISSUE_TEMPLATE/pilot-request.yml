name: Request a fixed-scope pilot
description: Start a public, non-sensitive QA or documentation engagement.
title: "Pilot request: "
labels:
  - pilot-request
body:
  - type: markdown
    attributes:
      value: |
        Thanks for considering VerifiDesk Works. Do not post passwords, API keys, private customer data, unpublished vulnerabilities, or wallet secrets. A request is not an agreement to begin work; scope and payment terms must be confirmed in writing first.
  - type: dropdown
    id: service
    attributes:
      label: Pilot type
      options:
        - Focused website QA — AED 350 / $100 (bank transfer, PayPal, or USDC)
        - Content pack from one recording — $125 (PayPal or USDC)
        - Lead or booking journey audit — $150 (PayPal or USDC)
        - Other fixed scope
    validations:
      required: true
  - type: input
    id: public-url
    attributes:
      label: Public project URL
      description: Link only to material that is safe to review publicly.
      placeholder: https://example.com
    validations:
      required: true
  - type: textarea
    id: journey
    attributes:
      label: User journey or deliverable
      description: Describe the one workflow, document set, or recording to review.
      placeholder: A new user opens the landing page, reads pricing, creates an account, and reaches the dashboard.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be present for the pilot to be accepted?
      placeholder: Reproduction steps, screenshots, severity, browser/device, and one retest.
    validations:
      required: true
  - type: input
    id: deadline
    attributes:
      label: Requested deadline
      placeholder: 2026-11-20 18:00 UTC
    validations:
      required: true
  - type: dropdown
    id: payment
    attributes:
      label: Preferred payment arrangement
      options:
        - 50% upfront and 50% on acceptance
        - Funded escrow or platform milestone
        - Full payment on acceptance for the AED 350 / $100 focused website QA pilot
        - Need to discuss
    validations:
      required: true
  - type: dropdown
    id: payment-rail
    attributes:
      label: Preferred payment method
      options:
        - UAE bank transfer
        - PayPal
        - USDC
        - Other agreed method
        - Need to discuss
    validations:
      required: true
  - type: input
    id: payment-details
    attributes:
      label: Proposed payment details
      description: For cryptocurrency, name the exact asset and network. Never post bank, PayPal, or other private account information here.
      placeholder: UAE bank transfer, PayPal invoice, or USDC on Base
  - type: checkboxes
    id: confirmation
    attributes:
      label: Public-request confirmation
      options:
        - label: I have not included credentials, wallet secrets, private customer data, or unpublished security findings.
          required: true
        - label: I understand tools and automation may be used; material assistance will be disclosed when relevant, requested, or required.
          required: true